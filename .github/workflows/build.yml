name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Inspect the produced jar
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "=== jar: $jar ==="
          unzip -l "$jar"
          for f in $(unzip -Z1 "$jar" | grep -E '\.json$'); do
            echo "=== $f ==="
            unzip -p "$jar" "$f"
            echo
          done

      - name: Check the hook targets against the real Minecraft classes
        run: |
          mc=$(find ~/.gradle/caches/fabric-loom -name '*.jar' 2>/dev/null \
                | xargs -I{} sh -c 'unzip -l "{}" 2>/dev/null | grep -q "net/minecraft/world/level/chunk/ChunkGenerator.class" && echo "{}"' \
                | head -1)
          echo "minecraft jar: $mc"
          if [ -z "$mc" ]; then echo "NOT FOUND"; exit 0; fi
          for c in \
            net.minecraft.world.level.chunk.ChunkGenerator \
            net.minecraft.world.level.levelgen.NoiseBasedChunkGenerator \
            net.minecraft.world.level.levelgen.FlatLevelSource \
            net.minecraft.world.level.levelgen.DebugLevelSource ; do
            echo "=== $c ==="
            javap -p -classpath "$mc" "$c" 2>&1 | grep -i "applyBiomeDecoration" || echo "  DOES NOT DECLARE applyBiomeDecoration"
          done
          echo "=== is it called from ChunkStatusTasks? ==="
          javap -p -c -classpath "$mc" net.minecraft.world.level.chunk.status.ChunkStatusTasks 2>&1 \
            | grep -i "applyBiomeDecoration" || echo "  NOT REFERENCED in ChunkStatusTasks"

      - name: Upload the mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: no-block-generation
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
