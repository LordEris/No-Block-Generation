name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Stage the jar on its own
        run: |
          mkdir -p release
          cp "$(ls build/libs/*.jar | grep -v -- '-sources')" release/
          ls -l release/

      - name: Upload the mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: no-block-generation
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      - name: Publish it as a directly downloadable jar
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Latest build
          body: |
            Download `no-block-generation-1.0.0.jar` below and drop it straight into
            `.minecraft/mods/`. Requires Fabric Loader on Minecraft 1.21.1. Fabric API is
            not needed.
          prerelease: true
          files: release/*.jar
          fail_on_unmatched_files: true
