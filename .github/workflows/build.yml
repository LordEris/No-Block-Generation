name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Read the mod version
        id: mod
        run: echo "version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Stage the jar on its own
        run: |
          mkdir -p release
          cp "$(ls build/libs/*.jar | grep -v -- '-sources')" release/
          ls -l release/

      - name: Upload the mod jar
        uses: actions/upload-artifact@v7
        with:
          name: no-block-generation
          path: release/*.jar
          if-no-files-found: error

      - name: Install the region file reader's dependency
        run: python3 -m pip install --quiet numpy

      - name: Run it on a real server and check the chunks it generates
        run: .github/scripts/smoke-test.sh "$(ls release/*.jar)"

      - name: Publish it as a directly downloadable jar
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.mod.outputs.version }}
          name: v${{ steps.mod.outputs.version }}
          body: |
            Download the `.jar` below and drop it straight into `.minecraft/mods/`.

            Requires Fabric Loader on Minecraft 26.3. Fabric API is not needed.
          prerelease: false
          files: release/*.jar
          fail_on_unmatched_files: true
