name: Build

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Inspect the produced jar
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "=== jar: $jar ==="
          unzip -l "$jar"
          for f in $(unzip -Z1 "$jar" | grep -E '\.json$'); do
            echo "=== $f ==="
            unzip -p "$jar" "$f"
            echo
          done

      - name: Upload the mod jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: no-block-generation
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
